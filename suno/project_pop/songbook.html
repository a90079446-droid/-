function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function field(label,id,text){return `<div class="field"><div class="fh"><span class="label">${label}</span><button class="copy" data-copy="${id}">Copy</button></div><pre id="${id}">${esc(text)}</pre></div>`}
list.innerHTML=SONGS.map((s,i)=>`<details class="song" data-type="${esc(s.type)}" ${i===0?'open':''}><summary><span class="no">${s.no}</span><span class="t">${esc(s.title)}</span><span class="sub">${esc(s.type)} · “${esc(s.hook)}”</span></summary><div class="body">
<div class="meta">${esc(s.topic)} — ${esc(s.speaker)}</div>
${field('① Song Title','t'+s.no,s.title)}
${field('② Lyrics','l'+s.no,s.lyrics)}
${field('③ Styles','s'+s.no,s.style)}
${field('④ Exclude Styles','e'+s.no,s.exclude)}
<div class="nums"><div class="num"><b>15%</b><span>⑤ Weirdness</span></div><div class="num"><b>85%</b><span>⑥ Style Influence</span></div><div class="num"><b>유지</b><span>⑦ 다양성</span></div></div>
</div></details>`).join('');

 const sel=()=>{const r=document.createRange();r.selectNodeContents(el);const w=getSelection();w.removeAllRanges();w.addRange(r);show('Selected — copy it')};
 try{navigator.clipboard.writeText(txt).then(()=>show('Copied'),sel)}catch(_){sel()}});
