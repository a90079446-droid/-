<script>
const D={"songs": [{"no": "1", "title": "New Habits", "meta": ["구조: 데일리형 + 드롭 (Intro → V1 → Pre → 사비 → 드롭 → V2 → 사비 → 브릿지 → 핵사비 → 마지막 드롭 → Outro)", "방향: 원곡 결 (멜로딕 퓨처베이스 팝) · 105 BPM · 84마디 약 3:12", "화자: 말로 돌아가려다 실패한 남자, 이번엔 작은 행동으로 증명한다"], "lyrics": "[Intro: Short instrumental, soft clean guitar and pluck synth]\n\n[Verse 1: Minimal, guitar and soft claps, low intimate tone]\nUsed to talk my way back in\nFlowers, speeches, and a grin\nYou stopped laughing at my lines\nStarted reading all the signs\nNow I'm standing at your gate\nSaying nothing, here to wait\n\n[Pre-Chorus: Build, rising synth and snare roll]\nNo more words to fill the air\nWatch me show up, I'll be there\n\n[Chorus: Half energy, warm pads and pluck synth, sincere]\nI'll prove it with the small things\nDoor held open, phone away\nNot a speech and not a promise\nJust the same man every day\n\n[Drop: Instrumental, bright pluck synth lead and future bass chords, deep sub bass]\n\n[Verse 2: Groove continues, guitar and claps, steady tone]\nThought it took a grand display\nPlane ticket and a big bouquet\nTurns out love is Tuesday night\nShowing up and getting it right\nYou don't need another vow\nJust the man you're seeing now\n\n[Chorus: Full energy, pads and pluck synth and drums]\nI'll prove it with the small things\nDoor held open, phone away\nNot a speech and not a promise\nJust the same man every day\n\n[Bridge: Drums drop out, guitar and vocal only]\nTook a while to see it clear\nEvery small thing kept you here\nI don't ask you to forget\nWatch me, I'm not finished yet\n\n[Final Chorus: Key change up, full drums and big future bass chords, doubled vocals]\nI'll prove it with the small things\nDoor held open, phone away\nNot a speech and not a promise\nSame man, every single day\n\n[Drop: Biggest instrumental drop, pluck lead and supersaw chords, heavy sub bass]\n\n[Outro: Clean guitar and pluck synth only]", "style": "melodic future bass pop, warm and heartfelt, 105 BPM, F minor, crisp claps and snappy snare, deep sub bass under the drop, bright pluck synth lead, lush supersaw chords in the drop, soft clean electric guitar in verses, solo male vocal, full chest voice, low-mid range, doubled lead vocal, sincere smooth delivery, clear upfront vocals, crisp clean modern mix, short intro, chorus into instrumental synth drop, bridge, final chorus with the biggest drop, English lyrics", "exclude": "pitched vocal chops, falsetto, ad-libs, female vocals, big room EDM, dubstep, airhorn, trap hi-hat rolls, stadium reverb, overly happy", "w": "30%", "si": "75%", "v": "40%"}, {"no": "2", "title": "Low Tide", "meta": ["구조: 데일리형 + 드롭", "방향: 트로피컬 하우스 팝 (밝고 바람 같은 쪽) · 102 BPM · 84마디 약 3:18", "화자: 크게 싸운 다음 날, 썰물 빠진 해변에서 먼저 사과하는 법을 배운 남자"], "lyrics": "[Intro: Short instrumental, marimba pluck and shakers]\n\n[Verse 1: Minimal, nylon guitar and soft kick, low intimate tone]\nWe said it all on Sunday\nLoud enough to fill the bay\nNow the beach is wide and quiet\nShells where all the arguments lay\nWalking out where sand is wet\nCount the things I won't forget\n\n[Pre-Chorus: Build, shakers and rising pad]\nEvery wave goes out to come back in\nLet it, let it begin\n\n[Chorus: Half energy, marimba and warm pads, breezy]\nMeet me where the water turns\nLeave the shoes and leave the show\nTide went out and took the shouting\nLet it bring us back in slow\n\n[Drop: Instrumental, marimba and steel drum lead, four-on-the-floor kick, round sub bass]\n\n[Verse 2: Groove continues, nylon guitar and shakers, softer tone]\nThought the first to speak would lose\nKept my pride and kept my shoes\nThen you waded out to me\nBarefoot, laughing, soaked to knee\nNobody lost when I said sorry\nOcean doesn't keep the story\n\n[Chorus: Full energy, marimba and drums and pads]\nMeet me where the water turns\nLeave the shoes and leave the show\nTide went out and took the shouting\nLet it bring us back in slow\n\n[Bridge: Drums drop out, nylon guitar and vocal only]\nOut and in, the water goes\nNobody owns it, nobody knows\nPride is heavy on the sand\nLighter when I take your hand\n\n[Final Chorus: Key change up, full groove, doubled vocals]\nMeet me where the water turns\nLeave the shoes and leave the show\nTide went out and took the shouting\nBring us back, and bring it slow\n\n[Drop: Biggest instrumental drop, marimba lead and steel drums, full kick and sub bass]\n\n[Outro: Marimba and shakers only]", "style": "tropical house pop, breezy and warm, 102 BPM, A-flat major, light four-on-the-floor kick with shakers, round soft sub bass, marimba and steel drum plucks, nylon string guitar, airy pads, solo male vocal, full chest voice, low-mid range, doubled lead vocal, relaxed warm delivery, clear upfront vocals, crisp clean modern mix, short intro, chorus into marimba-led instrumental drop, bridge, key change in final chorus, English lyrics", "exclude": "pitched vocal chops, falsetto, ad-libs, female vocals, reggae toasting, steel band parody, EDM festival drop, Christmas bells, overly cheesy, stadium reverb", "w": "30%", "si": "70%", "v": "45%"}, {"no": "3", "title": "Signed and Dated", "meta": ["구조: 데일리형 + 드롭", "방향: 데일리 무드 (어른스럽고 시크한 미니멀 일렉트로팝) · 100 BPM · 84마디 약 3:22", "화자: 무릎 꿇지도 사라지지도 않고, 사과를 한 줄로 끝낸 뒤 계산하고 나가는 남자"], "lyrics": "[Intro: Short instrumental, muted pluck synth and dry kick]\n\n[Verse 1: Minimal, sub bass pulse and vocal, low cool tone]\nReservation under someone else's name\nCorner table, you came all the same\nI ordered what you used to like\nYou ordered something new tonight\nSaid the thing I came to say\nShort, and then I looked away\n\n[Pre-Chorus: Build, filtered synth rising]\nRoom goes quiet, glasses down\nNobody else in town\n\n[Chorus: Half energy, muted pluck and soft pad, cool]\nHere's my sorry, signed and dated\nNo ribbon and no show\nI don't beg and I don't vanish\nI just say it, then I go\n\n[Drop: Instrumental, short filtered synth drop, dry drums and deep sub bass]\n\n[Verse 2: Groove tightens, dry drum machine, deadpan tone]\nUsed to et the story breathe\nClosed the book on me one Sunday in the fall\nLeft it on the table, not a word at all\nRead it back with every single line I got wrong\nSaw myself as villain in my own favorite song\nPicked a pen up, started over, every single night\nCrossin' out the old me till the paper turned white\n\n[Pre-Chorus: Mids swell, tension builds, sub bass held back]\nGive me one more read, just one more look\nI ain't the man who wrote that book\nEvery word you hated, I took out\nNow there's room for you to walk around\n\n[Chorus: Heavy sub bass and big drums hit together, wide future bass chords and pluck lead, long soaring notes, doubled vocals]\nI'm the second draft\nCross the old me out\nEvery line you hated\nI rewrote it now\nRed ink on my pages\nRead me one more time\nI ain't the first version\nI'm the better line\n\n[Breakdown: Drums drop out, quiet]\nFresh page, new start\n\n[Verse 2: Sparse claps and clean guitar, no sub bass, rapid rhythmic delivery]\nShowed up with the pages, didn't knock or make a scene\nSlid 'em under your door like I'm nineteen\nDidn't write a promise, wrote the Tuesday that I'd call\nWrote the dishes done, the picture straight upon the wall\nYou read it on the stairs, your coffee goin' cold\nMarked it up in pencil, said it's better than the old\nAin't the ending yet, just a page that we can turn\nSecond draft is how the stubborn ones finally learn\n\n[Pre-Chorus: Mids swell, tension builds, sub bass held back]\nGive me one more read, just one more look\nI ain't the man who wrote that book\nEvery word you hated, I took out\nNow there's room for you to walk around\n\n[Chorus: Heavy sub bass and big drums hit together, wide future bass chords and pluck lead, long soaring notes, doubled vocals]\nI'm the second draft\nCross the old me out\nEvery line you hated\nI rewrote it now\nRed ink on my pages\nRead me one more time\nI ain't the first version\nI'm the better line\n\n[Bridge: Sub and bass stripped out, rapid-fire short phrases]\nCross it out\nWrite it in\nTear it up\nStart again\nLine by line\nPage by page\nNot the man\nFrom that first page\n\n[Final Chorus: Lifts up a half step, loudest peak, biggest future bass drop, doubled vocals]\nI'm the second draft\nCross the old me out\nEvery line you hated\nI rewrote it now\nRed ink on my pages\nRead me one more time\nI ain't the first version\nNow I'm yours to sign\n\n[Outro: Quiet, soft sung reprise over the pad]\nFirst time I wrote us, I wrote it too fast\nSecond time round, I wrote us to last", "style": "alternative pop with future bass, cinematic; mid-tempo pulse at 105 BPM in F minor; verses with no sub bass, sparse claps and clean guitar, choruses where heavy sub bass and big drums hit together with wide future bass chords and a bright pluck lead; doubled lead vocal; low-register male voice, rapid rhythmic delivery in verses, long soaring held notes in choruses, final chorus lifts a half step at maximum power, English lyrics", "exclude": "female vocals, falsetto, pitched vocal chops, metal, screaming, big room EDM, autotune, lo-fi, muffled vocals, Christmas bells", "w": "15%", "si": "85%", "v": "유지"}, {"no": "5", "title": "Fluent", "meta": ["구조: 데일리형 + 드롭", "방향: 어쿠스틱 기타 EDM 팝 (따뜻하고 희망적인 쪽) · 108 BPM · 84마디 약 3:07", "화자: 늘 먼저 말하던 남자가 상대의 침묵까지 읽는 법을 배운다"], "lyrics": "[Intro: Short instrumental, strummed acoustic guitar]\n\n[Verse 1: Minimal, acoustic guitar and soft kick, low intimate tone]\nI used to answer way too fast\nTalking over all your past\nHeard the words but not the tone\nLeft you speaking all alone\nNow I study how you stand\nWhat you mean with empty hands\n\n[Pre-Chorus: Build, claps and rising pad]\nQuiet is a sentence too\nTook me long enough to know it's true\n\n[Chorus: Half energy, acoustic guitar and warm pad, hopeful]\nI'm getting fluent in you\nEvery pause and every sigh\nTook me years to learn the grammar\nNow I hear the reason why\n\n[Drop: Instrumental, plucked guitar melody lead, punchy kick and claps, deep sub bass]\n\n[Verse 2: Groove continues, guitar and claps, warm tone]\nThought that love was saying more\nLouder vows behind the door\nTurns out love is shutting up\nReading how you hold the cup\nNow you finish what you start\nI just listen, that's the art\n\n[Chorus: Full energy, guitar and drums and pad]\nI'm getting fluent in you\nEvery pause and every sigh\nTook me years to learn the grammar\nNow I hear the reason why\n\n[Bridge: Drums drop out, acoustic guitar and vocal only]\nSay it slow, I'm taking notes\nEvery word, the way it floats\nI don't need the last reply\nLearning how you say goodnight\n\n[Final Chorus: Key change up, full drums and guitar, doubled vocals]\nI'm getting fluent in you\nEvery pause and every sigh\nTook me years to learn the grammar\nFinally, I'm hearing why\n\n[Drop: Biggest instrumental drop, guitar pluck lead and synth chords, full kick and sub bass]\n\n[Outro: Strummed acoustic guitar only]", "style": "acoustic guitar EDM pop, warm and hopeful, 108 BPM, D-flat major, strummed acoustic guitar in verses, punchy kick and claps building into the chorus, deep sub bass in the drop, plucked guitar melody as the drop lead, soft synth pad, solo male vocal, full chest voice, low-mid range, doubled lead vocal, gentle sincere delivery, clear upfront vocals, crisp clean modern mix, short intro, chorus into guitar-led instrumental drop, bridge, key change in final chorus, English lyrics", "exclude": "pitched vocal chops, falsetto, ad-libs, female vocals, country twang, big room drop, dubstep, Christmas bells, stadium reverb, overly sweet", "w": "30%", "si": "70%", "v": "45%"}], "analysis": ["발매 2017-09-21, 길이 3:18 (Wikipedia)", "템포 105 BPM, 키 F minor (DJ 트랙 데이터베이스). AcousticBrainz는 멜로디 기준 C# major, 코드 기준 F minor로 봄 → F minor 기준으로 씀", "주제: 상처 준 사랑을 고백하고 \"다른 방식으로\" 사랑하겠다고 약속하는 내용 (Wikipedia)", "반응: \"지붕 열고 드라이브하고 싶어지는 곡\" (Complex), 바이럴 영상과 수천만 스트리밍 (EarMilk 2017)", "사운드(일반 지식, 오디오 직접 측정 못 함): 부드러운 남성 보컬 벌스 → 빌드업 → 피치를 바꾼 보컬 찹과 퓨처베이스 코드가 이끄는 연주 드롭. 이번 곡들은 기본 규칙에 따라 보컬 찹 대신 신스·마림바·기타 리드로 드롭을 만듦", "원곡 가사·멜로디·제목 문구는 쓰지 않음"]};
const toast=document.getElementById('toast');let tt;
function show(m){toast.textContent=m;toast.hidden=false;clearTimeout(tt);tt=setTimeout(()=>toast.hidden=true,1400)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
if(D.analysis.length){document.getElementById('ana').innerHTML='<details class="song"><summary><span class="no">i</span><span class="t">레퍼런스 분석</span><span class="sub">출처와 측정 한계 포함</span></summary><div class="body"><ul class="alist">'+D.analysis.map(a=>'<li>'+esc(a)+'</li>').join('')+'</ul></div></details>'}
function field(label,id,text){return text?`<div class="field"><div class="fh"><span class="label">${label}</span><button class="copy" data-copy="${id}">Copy</button></div><pre id="${id}">${esc(text)}</pre></div>`:''}
document.getElementById('list').innerHTML=D.songs.map((s,i)=>`<details class="song" ${i===0?'open':''}><summary><span class="no">${esc(s.no)}</span><span class="t">${esc(s.title)}</span><span class="sub">${esc((s.meta.find(m=>m.startsWith('방향'))||s.meta[0]||'').replace(/^방향: /,''))}</span></summary><div class="body">
<ul class="meta">${s.meta.map(m=>'<li>'+esc(m)+'</li>').join('')}</ul>
${field('① Song Title','t'+i,s.title)}${field('② Lyrics','l'+i,s.lyrics)}${field('③ Styles','s'+i,s.style)}${field('④ Exclude Styles','e'+i,s.exclude)}
<div class="nums"><div class="num"><b>${esc(s.w)}</b><span>⑤ Weirdness</span></div><div class="num"><b>${esc(s.si)}</b><span>⑥ Style Influence</span></div><div class="num"><b>${esc(s.v)}</b><span>⑦ 다양성</span></div></div>
</div></details>`).join('');
document.addEventListener('click',e=>{const b=e.target.closest('.copy');if(!b)return;const el=document.getElementById(b.dataset.copy);
 const sel=()=>{const r=document.createRange();r.selectNodeContents(el);const w=getSelection();w.removeAllRanges();w.addRange(r);show('Selected — copy it')};
 try{navigator.clipboard.writeText(el.textContent).then(()=>show('Copied'),sel)}catch(_){sel()}});
