ld notes in choruses, final chorus lifts a half step at maximum power, English lyrics", "exclude": "female vocals, falsetto, vocal runs, talkbox, metal, screaming, EDM drop, autotune, lo-fi, muffled vocals", "w": "15%", "si": "85%", "v": "유지"}, {"no": "5", "title": "Cruise Control", "meta": ["구조: 데일리형", "방향: 서부 해안 펑크 팝 (향수 어린 드라이브 쪽) · 96 BPM · 72마디 약 3:00", "화자: 성공해서 떠났다가 옛 친구들을 태우고 다시 해안 고속도로를 달리는 남자"], "lyrics": "[Intro: Short instrumental, funk bass and smooth synth lead]\n\n[Verse 1: Minimal, bass and claps, low easy tone]\nFriday off at half past four\nPick up Danny at the store\nMarcus brought the old cassette\nRewound by pencil, no regret\nFreeway open and the windows wide\nPalm trees waving either side\n\n[Pre-Chorus: Drums enter, chorus guitar]\nNobody's rushing anywhere\nLittle wind in all our hair\n\n[Chorus: Half energy, bouncy drums and funk bass, smooth synth lead]\nSet it on cruise control\nSunset sitting on the hood\nGot my people in the back seat\nEverything is feeling good\n\n[Verse 2: Groove settles, Rhodes and guitar, warm tone]\nThought I'd outgrow this old crew\nBigger house, a better view\nGot the house, the view was fine\nMissed the laughing all the time\nNow I drive the long way down\nSame old faces, same old town\n\n[Chorus: Full groove, drums and bass and synth lead]\nSet it on cruise control\nSunset sitting on the hood\nGot my people in the back seat\nEverything is feeling good\n\n[Bridge: Drums drop out, Rhodes and vocal only]\nPass the snacks and turn it up\nSomebody spilled the soda cup\nNobody cares, the night is new\nTwenty years, same view\n\n[Final Chorus: Fullest groove, doubled vocals]\nSet it on cruise control\nSunset sitting on the hood\nGot my people in the back seat\nSame old friends, it's still that good\n\n[Outro: Funk bass and synth lead only]", "style": "West Coast funk pop, sunny and nostalgic, 96 BPM, G major, laid-back bouncy drums with claps, deep rolling funk bass, smooth high synth lead line, clean chorus-effect gu const toast=document.getElementById('toast');let tt;
function show(m){toast.textContent=m;toast.hidden=false;clearTimeout(tt);tt=setTimeout(()=>toast.hidden=true,1400)}

document.addEventListener('click',e=>{const b=e.target.closest('.copy');if(!b)return;const el=document.getElementById(b.dataset.copy);
