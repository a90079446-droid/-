:root[data-theme="dark"]{--bg:#13151a;--surface:#1c1f26;--fg:#e8eaee;--muted:#9aa1ad;--line:#2c313b;--accent:#7f9cff;--accent-fg:#0f1320;--chip:#252c40;color-scheme:dark}

.copy:focus-visible,.filters button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

 full chest voice, low-mid range rising to powerful chest belting, doubled lead vocal in chorus, raw sincere delivery, clear upfront vocals, crisp modern mix, very quiet verses and huge choruses, short intro, bridge, final chorus at maximum power, English lyrics", "exclude": "falsetto, vocal runs, ad-libs, female vocals, metal, screaming, EDM, autotune, gospel choir, musical theater", "w": "30%", "si": "80%", "v": "40%"}, {"no": "2", "title": "Other Shoe", "meta": ["구조: 데일리형", "방향: 피아노 록 발라드 + 스트링 · 72 BPM · 52마디 약 2:53", "화자: 10년 내리 운이 없다가 처음 좋은 해를 맞은 남자, 언제 깨질지 기다린다"], "lyrics": "[Intro: Short instrumental, solo grand piano]\n\n[Verse 1: Piano only, quiet, low intimate tone]\nLost the job and lost the car\nLearned how far is really far\nThen this year the phone just rang\nFirst good news, and then you sang\nPaid the debts I used to hide\nOpened up the windows wide\n\n[Pre-Chorus: Soft strings enter]\nEvery lucky day I flinch\nWaiting for it, inch by inch\n\n[Chorus: Half energy, piano and strings and light drums]\nWaiting on the other shoe\nSun came up the same today\nTen bad winters taught me flinching\nThis one doesn't feel that way\n\n[Verse 2: Drums and bass enter softly, steady tone]\nKept a bag packed by the door\nJust in case it fell once more\nThen I hung my coat to stay\nFolded shirts and put them away\nShoe can drop, I'll hear it land\nI'll be holding steady hands\n\n[Chorus: Full drums and electric guitar swells, strong chest voice]\nWaiting on the other shoe\nSun came up the same today\nTen bad winters taught me flinching\nThis one doesn't feel that way\n\n[Bridge: Strings build up, piano arpeggios]\nMaybe it falls tomorrow\nMaybe it never does\nEither way I'm standing\nRight here, where I was\n\n[Final Chorus: Key change up a whole step, full band and strings, powerful chest voice, doubled vocals]\nWaiting on the other shoe\nSun came up the same today\nTen bad winters taught me flinching\nLet it drop, I'm here to stay\n\n[Outro: Solo piano]", "style": "piano rock ballad with strings, hopeful and cinematic, 72 BPM, D-flat major, solo grand piano in verses, live drums and electric guitar swells in choruses, round bass, lush string section, solo male vocal, full chest voice, low-mid range, doubled lead vocal, steady sincere delivery, clear upfront vocals, crisp clean modern mix, short intro, bridge with strings building, whole-step key change in final chorus, English lyrics", "exclude": "falsetto, vocal runs, trot vibrato, musical theater, ad-libs, female vocals, EDM, choir, heavy distortion, country twang", "w": "25%", "si": "75%", "v": "35%"}, {"no": "3", "title": "Insured", "meta": ["구조: 데일리형", "방향: 데일리 무드 (어른스럽고 시크한 절제된 얼터너티브 팝 발라드) · 74 BPM · 52마디 약 2:49", "화자: 그림, 와인, 집까지 전부 보험에 든 부자. 정작 가장 소중한 사람은 보험이 안 된다"], "lyrics": "[Intro: Short instrumental, felt piano and soft bass]\n\n[Verse 1: Minimal, bass and felt piano, low cool tone]\nAgent came on Tuesday at ten\nClipboard, pen, and a polished grin\nValued every painting, counted wine\nSigned the bottom dotted line\nHe asked if there was something more\nYou were laughing by the door\n\n[Pre-Chorus: Brushed drums enter, string pad rises]\nNot a number on a page\nNothing I could rearrange\n\n[Chorus: Half energy, muted guitar and piano, cool]\nEven the good things get insured\nWatch, the car, the house, the view\nSigned a policy on everything\nCouldn't find one made for you\n\n[Verse 2: Brushed drums and bass, deadpan tone]\nThought that money built a wall\nBought coverage against it all\nThen you caught a fever in June\nSat in waiting rooms till noon\nNo one there to call or pay\nJust a hand to hold all day\n\n[Chorus: Fuller, drums and guitar and strings]\nEven the good things get insured\nWatch, the car, the house, the view\nSigned a policy on everything\nCouldn't find one made for you\n\n[Bridge: Piano and vocal only, close]\nSold the boat in early spring\nKept the evenings, every one\nNothing guarantees a thing\nSo I'm here till it's done\n\n[Final Chorus: Key change up a half step, full drums and strings, doubled vocals]\nEven the good things get insured\nWatch, the car, the house, the view\nSigned a policy on everything\nSo I'm staying close to you\n\n[Outro: Felt piano only]", "style": "restrained alternative pop ballad, cool and wry, 74 BPM, G minor, soft brushed drums, deep round bass, muted electric guitar, felt piano, subtle string pad, solo male vocal, full chest voice, low range, doubled lead vocal, cool deadpan delivery, clear upfront vocals, crisp clean modern mix, sparse verses, chorus lifts with drums, bridge with piano and vocal only, half-step key change in final chorus, English lyrics", "exclude": "falsetto, belting, vocal runs, ad-libs, female vocals, choir, EDM, stadium reverb, overly dramatic, musical theater", "w": "30%", "si": "75%", "v": "40%"}, {"no": "4", "title": "THIN ICE", "meta": ["구조: 기본형", "방향: 프로젝트 pop 스타일 (얼터너티브 팝록, 조용한 어쿠스틱 벌스와 터지는 후렴, 서브베이스 대비) · 70 BPM · 약 3:20", "은유: 사랑하는 모든 것을 지고 얇은 얼음 위를 건너는 사람 / 훅: \"Let it crack, I'm still walkin'\"", "화자: 봄까지 기다리라는 말을 듣고도 얼어붙은 호수를 건너 가족에게 간 남자"], "lyrics": "[Intro: Quiet sung over fingerpicked acoustic guitar, no drums]\nOut on the lake where the winter runs thin\nCarryin' everything I ever let in\n\n[Verse 1: Fingerpicked acoustic guitar and sparse drums, no sub bass, rapid rhythmic delivery]\nHad a cabin and a family on the other shore\nOnly way to reach 'em was across the frozen floor\nOld men at the dock said wait until the spring\nIce ain't thick enough to hold a single thing\nBut I made a promise and I meant it every word\nLaced my boots and stepped out where the creakin's heard\nEvery step's a crack that runs beneath my feet\nEvery breath's a cloud, and still I keep a steady speed\n\n[Pre-Chorus: Mids swell, tension builds, sub bass held back]\nHear it groanin' underneath me now\nEvery gust is tryin' to push me down\nI don't run, I spread the weight out slow\nLight enough to carry what I know\n\n[Chorus: Heavy sub bass and big drums hit together, crunchy electric guitars, long soaring notes in powerful chest voice, doubled vocals]\nLet it crack, I'm still walkin'\nIce beneath, I'm not stoppin'\nEvery line that splits\nHolds a little longer\nEverything I love\nWaits on the other side\nLet it crack below me\nI won't break my stride\n\n[Breakdown: Drums drop out, quiet]\nSteady, steady, slow\n\n[Verse 2: Fingerpicked acoustic guitar and sparse drums, no sub bass, rapid rhythmic delivery]\nHalfway out it split behind me like a gun\nDidn't turn around, I kept my eyes on the sun\nSaw the kitchen window and my daughter at the pane\nWavin' me home like the ice would never break\nNow she's grown and askin' how I ever made it through\nLove is weight you carry when the floor is new\nDon't wait for the spring to say the way is clear\nEvery step you take is how the ice holds here\n\n[Pre-Chorus: Mids swell, tension builds, sub bass held back]\nHear it groanin' underneath me now\nEvery gust is tryin' to push me down\nI don't run, I spread the weight out slow\nLight enough to carry what I know\n\n[Chorus: Heavy sub bass and big drums hit together, crunchy electric guitars, long soaring notes in powerful chest voice, doubled vocals]\nLet it crack, I'm still walkin'\nIce beneath, I'm not stoppin'\nEvery line that splits\nHolds a little longer\nEverything I love\nWaits on the other side\nLet it crack below me\nI won't break my stride\n\n[Bridge: Sub and bass stripped out, rapid-fire short phrases]\nStep, breathe\nStep, breathe\nCrack, hold\nCrack, hold\nDon't stop\nDon't look\nOther side\nAlmost home\n\n[Final Chorus: Lifts up a half step, loudest peak, full band, doubled vocals]\nLet it crack, I'm still walkin'\nIce beneath, I'm not stoppin'\nEvery line that splits\nHolds a little longer\nEverything I love\nWaits on the other side\nLet it crack below me\nI'm still walkin' home\n\n[Outro: Quiet, soft sung reprise over acoustic guitar]\nOut on the lake where the winter runs thin\nI carried it all and I carried you in", "style": "alternative pop rock, cinematic; slow 70 BPM pulse in B-flat major; verses with no sub bass, fingerpicked acoustic guitar and sparse drums, choruses where heavy sub bass and big drums hit together with crunchy electric guitars; piano accents; doubled lead vocal; low-register male voice, rapid rhythmic delivery in verses, long soaring held notes in powerful chest voice in choruses, final chorus lifts a half step at maximum power, English lyrics", "exclude": "female vocals, falsetto, vocal runs, metal, screaming, EDM drop, autotune, lo-fi, muffled vocals, gospel choir", "w": "15%", "si": "85%", "v": "유지"}, {"no": "5", "title": "Count 'Em", "meta": ["구조: 데일리형", "방향: 포크록 스톰프 앤섬 (따뜻하고 다 같이 부르는 쪽) · 70 BPM 하프타임 (=140 스톰프) · 52마디 약 2:58", "화자: 도시에서 10년을 보내고 돌아와 가족 식탁의 빈자리 없는 의자를 세는 남자"], "lyrics": "[Intro: Short instrumental, kick drum stomps and strummed acoustic guitar]\n\n[Verse 1: Acoustic guitar and soft stomps, low warm tone]\nGrandpa's chair beside the door\nMuddy boots across the floor\nMy brother's back from overseas\nKids are climbing up the trees\nMother sings the same old song\nEvery word we get it wrong\n\n[Pre-Chorus: Claps enter, banjo picks up]\nSomeday these chairs will thin\nNot tonight, so let them in\n\n[Chorus: Half energy, stomps and claps and guitars, warm]\nCount 'em while I've got 'em\nEvery name I used to know\nRaise a glass to all still standing\nStomp the floor and say hello\n\n[Verse 2: Upright bass and banjo, steady stomps, warm tone]\nSpent ten years in city lights\nChasing names and sleepless nights\nThought the good life lived out there\nTurns out it was in this chair\nNow I stomp along and clap\nBaby sleeping on my lap\n\n[Chorus: Full stomp, drums and guitars and piano, hearty]\nCount 'em while I've got 'em\nEvery name I used to know\nRaise a glass to all still standing\nStomp the floor and say hello\n\n[Bridge: Claps and vocal only]\nHands on the table, one, two\nBoots on the floorboards too\nSome won't be here next year\nSo we sing it loud and clear\n\n[Final Chorus: Key change up, full band stomp, doubled vocals]\nCount 'em while I've got 'em\nEvery name I used to know\nRaise a glass to all still standing\nHold 'em close before they go\n\n[Outro: Stomps and acoustic guitar, final stomp]", "style": "folk rock stomp anthem, warm and communal, 70 BPM half-time feel with 140 BPM stomp, E-flat major, kick drum stomps and hand claps, strummed acoustic guitars, banjo picking, upright bass, piano, solo male vocal, full chest voice, low-mid range, doubled lead vocal, warm hearty delivery, clear upfront vocals, crisp clean modern mix, short intro, stomp builds into chorus, bridge with claps and vocal, key change in final chorus, English lyrics", "exclude": "gang vocals, falsetto, ad-libs, female vocals, country twang, bluegrass parody, EDM, stadium reverb, Christmas bells, yodel", "w": "30%", "si": "70%", "v": "45%"}], "analysis": ["템포 70 BPM (Music Will 차트, 원곡 템포 반주). 키 B-flat major (Wikipedia, 악보 원조성). Hooktheory만 B major", "공동 작곡 Jack LaFrantz, Evan Blair(프로듀서). 다 느린 버전과 후렴 3번 버전 사이에서 고민했고 후반 작업에 약 2주 (Wikipedia 등)", "구조 핵심: 조용하고 내밀한 벌스에서 후렴이 확 열림 (NPR 2024-03-05). 풀 프로덕션 후렴을 듣고 히트를 확신했다고 본인이 말함", "보컬: 이전 곡보다 힘을 보여 주는 곡 (Wikipedia). 고음 처리 방식은 확인 못 함", "주제: 꼭 필요한 것을 잃을까 두려운 마음, 기쁨이 깨지기 쉽다는 감각 (본인 발언, Songfacts)", "성적: Billboard Hot 100 최고 2위, 2024 MTV VMA 최우수 얼터너티브 뮤직비디오 (Wikipedia)", "오디오는 유튜브가 다운로드를 막아 직접 측정하지 못함", "이번 곡들: 기본값에 따라 남성 저~중음 진성. 원곡의 고음 클라이맥스는 진성 벨팅으로 옮기고 가성은 막음. 원곡 가사·멜로디·제목 문구는 쓰지 않음"]};
const toast=document.getElementById('toast');let tt;
function show(m){toast.textContent=m;toast.hidden=false;clearTimeout(tt);tt=setTimeout(()=>toast.hidden=true,1400)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
if(D.analysis.length){document.getElementById('ana').innerHTML='<details class="song"><summary><span class="no">i</span><span class="t">레퍼런스 분석</span><span class="sub">출처와 측정 한계 포함</span></summary><div class="body"><ul class="alist">'+D.analysis.map(a=>'<li>'+esc(a)+'</li>').join('')+'</ul></div></details>'}
function field(label,id,text){return text?`<div class="field"><div class="fh"><span class="label">${label}</span><button class="copy" data-copy="${id}">Copy</button></div><pre id="${id}">${esc(text)}</pre></div>`:''}
document.getElementById('list').innerHTML=D.songs.map((s,i)=>`<details class="song" ${i===0?'open':''}><summary><span class="no">${esc(s.no)}</span><span class="t">${esc(s.title)}</span><span class="sub">${esc((s.meta.find(m=>m.startsWith('방향'))||s.meta[0]||'').replace(/^방향: /,''))}</span></summary><div class="body">
<ul class="meta">${s.meta.map(m=>'<li>'+esc(m)+'</li>').join('')}</ul>
${field('① Song Title','t'+i,s.title)}${field('② Lyrics','l'+i,s.lyrics)}${field('③ Styles','s'+i,s.style)}${field('④ Exclude Styles','e'+i,s.exclude)}
<div class="nums"><div class="num"><b>${esc(s.w)}</b><span>⑤ Weirdness</span></div><div class="num"><b>${esc(s.si)}</b><span>⑥ Style Influence</span></div><div class="num"><b>${esc(s.v)}</b><span>⑦ 다양성</span></div></div>
</div></details>`).join('');
document.addEventListener('click',e=>{const b=e.target.closest('.copy');if(!b)return;const el=document.getElementById(b.dataset.copy);
 const sel=()=>{const r=document.createRange();r.selectNodeContents(el);const w=getSelection();w.removeAllRanges();w.addRange(r);show('Selected — copy it')};
 try{navigator.clipboard.writeText(el.textContent).then(()=>show('Copied'),sel)}catch(_){sel()}});
