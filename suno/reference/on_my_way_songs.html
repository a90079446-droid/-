<style>

:root[data-theme="dark"]{--bg:#13151a;--surface:#1c1f26;--fg:#e8eaee;--muted:#9aa1ad;--line:#2c313b;--accent:#7f9cff;--accent-fg:#0f1320;--chip:#252c40;color-scheme:dark}

.no{font-family:var(--display);font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;grid-row:span 2}
.t{font-family:var(--display);font-weight:700;font-size:1.05rem;min-width:0}
.sub{color:var(--muted);font-size:.85rem;min-width:0}
.body{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
.meta{font-size:.88rem;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.fh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.label{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.copy{font:inherit;font-size:.82rem;font-weight:600;border:0;border-radius:8px;padding:6px 12px;background:var(--accent);color:var(--accent-fg);cursor:pointer}
.copy:focus-visible,.filters button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
pre{margin:0;font-family:var(--mono);font-size:.8rem;line-height:1.55;white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;max-height:340px;overflow:auto}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

cked saw synth lead melody, wide atmospheric pads, soft piano in verses, solo male vocal, full chest voice, low-mid range, doubled lead vocal, steady sincere delivery, clear upfront vocals, crisp clean modern mix, short intro, chorus into instrumental synth lead drop, bridge, final chorus with the biggest drop, English lyrics", "exclude": "pitched vocal chops, falsetto, ad-libs, female vocals, Spanish lyrics, reggaeton, dubstep, big room airhorn, children's choir, overly happy", "w": "30%", "si": "75%", "v": "40%"}, {"no": "2", "title": "Drop Zone", "meta": ["구조: 데일리형 + 드롭", "방향: 게임 협업 쪽 (에픽 오케스트럴 EDM 앤섬) · 90 BPM · 70마디 약 3:07", "화자: 낯선 땅에 낙하한 백 명 중 하나, 혼자 살아남겠다던 믿음이 깨진다"], "lyrics": "[Intro: Short instrumental, staccato strings and low drums]\n\n[Verse 1: Minimal, string ostinato and soft taiko, low tense tone]\nEngines humming over open ground\nHundred strangers, nobody makes a sound\nLight goes green above the door\nNobody's waiting to be sure\nI don't check the map again\nMemorized it way back when\n\n[Pre-Chorus: Build, brass swells and rising drums]\nWind is loud and the floor is gone\nCount to three and carry on\n\n[Chorus: Half energy, strings and brass, commanding]\nJump first, ask questions later\nDoors are open, here we go\nHundred landing, one walks out\nEvery one of them will know\n\n[Drop: Instrumental, soaring synth lead over orchestral hits, taiko and rolling sub bass]\n\n[Verse 2: Groove continues, strings and drums, steady tone]\nThought the way to win was alone\nTrust nobody, guard your own\nThen a stranger shared his cover\nAsked for nothing, pointed me further\nLast two standing on the hill\nBack to back and standing still\n\n[Chorus: Full energy, orchestra and drums]\nJump first, ask questions later\nDoors are open, here we go\nHundred landing, one walks out\nEvery one of them will know\n\n[Bridge: Drums drop out, low strings and vocal only]\nCircle closing all around\nKeep your head and hold your ground\nOne more minute, one more mile\nThen we walk out, single file\n\n[Final Chorus: Key change up, full orchestra and big drums, doubled vocals]\nJump first, ask questions later\nDoors are open, here we go\nHundred landing, one walks out\nNow the whole world gets to know\n\n[Drop: Biggest instrumental drop, synth lead and brass, taiko and heavy sub bass]\n\n[Outro: Staccato strings only, final hit]", "style": "epic orchestral EDM anthem, heroic and tense, 90 BPM half-time feel, D minor, cinematic taiko and big drums, rolling sub bass, staccato string ostinato, brass swells, soaring synth lead in the drop, solo male vocal, full chest voice, low-mid range, doubled lead vocal, confident commanding delivery, clear upfront vocals, crisp clean modern mix, short intro, chorus into orchestral synth drop, bridge, key change in final chorus, English lyrics", "exclude": "pitched vocal chops, falsetto, ad-libs, female vocals, choir chanting, metal, dubstep, trailer braams, chiptune, overly happy", "w": "30%", "si": "75%", "v": "45%"}, {"no": "3", "title": "No Forwarding Address", "meta": ["구조: 데일리형 + 드롭", "방향: 데일리 무드 (어른스럽고 시크한 미니멀 멜로딕 일렉트로닉) · 88 BPM · 70마디 약 3:11", "화자: 집세를 미리 내 두고 아무 주소도 남기지 않은 채 떠난 남자"], "lyrics": "[Intro: Short instrumental, muted plucked synth and distant piano]\n\n[Verse 1: Minimal, sub bass and vocal, low cool tone]\nPacked one suitcase, left the rest\nFolded shirts and one good vest\nPaid the rent through next July\nNever told the street goodbye\nTaxi idles by the curb\nDoorman nods, he won't disturb\n\n[Pre-Chorus: Build, filtered synth rising]\nFlight is boarding, phone goes off\nLet them call, I'm well aloft\n\n[Chorus: Half energy, plucked synth and soft pad, cool]\nNo forwarding address, sorry\nTell the doorman I'm away\nKeys are hanging where you'll find them\nNothing more I need to say\n\n[Drop: Instrumental, short filtered synth drop, dry drums and deep sub bass]\n\n[Verse 2: Groove tightens, dry drums, deadpan tone]\nThought they'd chase me down the stairs\nCalling lawyers, calling fr ch way they'd go\nLearned the sound of footsteps on a wooden floor\nLearned to hold my breath behind a half-closed door\nEvery minute that the circle tightened on the map\nSomebody got greedy, somebody fell for the trap\nI ain't the fastest and I ain't the loudest one\nBut I'm still standin' when the shrinkin' circle's done\n\n[Pre-Chorus: Mids swell, tension builds, sub bass held back]\nWall is movin' in, it's comin' near\nNinety left, then twenty, now we're here\nEvery step I take, I take it slow\nEvery one I passed, they had to go\n\n[Chorus: Heavy sub bass and big tom drums hit together, soaring plucked synth lead, long soaring notes, doubled vocals]\nClose the circle on me\nI'll be standin' in it\nEvery wall you send\nI just walk within it\nHundred hit the ground\nOnly one walks out\nTighten up the circle\nI ain't goin' out\n\n[Breakdown: Drums drop out, quiet]\nHold still, hold still\n\n[Verse 2: Sparse claps and muted piano, no sub bass, rapid rhythmic delivery]\nDown to two of us, a field of grass and wind\nHe was runnin' loud, I let the quiet win\nDidn't need the biggest gun, I needed one more breath\nPatience is the thing that they forgot to test\nNow my little brother's playin', sweatin' every round\nSaid just stay inside it, breathe, and hold your ground\nDoesn't matter where you drop or how far you go\nEvery circle closes, and the patient ones will know\n\n[Pre-Chorus: Mids swell, tension builds, sub bass held back]\nWall is movin' in, it's comin' near\nNinety left, then twenty, now we're here\nEvery step I take, I take it slow\nEvery one I passed, they had to go\n\n[Chorus: Heavy sub bass and big tom drums hit together, soaring plucked synth lead, long soaring notes, doubled vocals]\nClose the circle on me\nI'll be standin' in it\nEvery wall you send\nI just walk within it\nHundred hit the ground\nOnly one walks out\nTighten up the circle\nI ain't goin' out\n\n[Bridge: Sub and bass stripped out, rapid-fire short phrases]\nDrop in, lay low\nWall moves, d hook, deep reese bass]\n\n[Verse 2: Half-time feel, piano and breakbeat, steady tone]\nWrote a speech on every mile\nTore it up and drove a while\nWords won't fix the way I left\nShowing up is all that's left\nSee your street at half past two\nNothing rehearsed, just me and you\n\n[Chorus: Full energy, rolling drums and pads]\nTwo hours out and closing in\nEvery mile I'm letting go\nLeave the window cracked a little\nJust enough so I will know\n\n[Bridge: Drums drop out, piano and vocal only]\nEngine ticking in the drive\nYou come out, the door half wide\nDidn't need the speech I wrote\nJust the keys and an old coat\n\n[Final Chorus: Key change up, full-speed drums, doubled vocals]\nTwo hours out and closing in\nEvery mile I'm letting go\nLeave the window cracked a little\nHere I am, and now you know\n\n[Drop: Biggest instrumental drop, synth lead and rolling breakbeat, heavy reese bass]\n\n[Outro: Soft piano chords only]", "style": "melodic drum and bass pop, driving and hopeful, 170 BPM, E major, fast rolling breakbeat drums, deep reese sub bass, shimmering synth pads, plucked synth lead hook in the drop, soft piano chords in verses, solo male vocal, full chest voice, low-mid range, doubled lead vocal, warm sincere delivery, clear upfront vocals, crisp clean modern mix, short intro, half-time verses, chorus into full-speed drop, bridge, key change in final chorus, English lyrics", "exclude": "pitched vocal chops, falsetto, ad-libs, female vocals, jump-up wobble bass, neurofunk, dubstep, Christmas bells, stadium reverb, overly happy", "w": "35%", "si": "70%", "v": "45%"}], "analysis": ["발매 2019-03-21 (MER·Sony Music). 프로듀서 Alan Walker, Big Fred. 3인 협업곡이고 Farruko 파트는 스페인어 (Wikipedia)", "게임 PUBG와 협업해 공개 (Wikipedia 기반 페이지)", "템포 85 BPM (Wikipedia, DJ 데이터베이스, AcousticBrainz 일치). Shazam 155는 예외값", "키는 출처마다 다름: C# minor (Wikipedia, Mixmeister, AcousticBrainz) / E major (노래방 반주, 악보). 둘은 나란한조라 C# minor 기준으로 씀", "주제: 끝까지 버티고 나아가는 영웅 서사, 자신을 지키는 태도 (가사 해설 블로그, 의견 수준)", "사운 const toast=document.getElementById('toast');let tt;
function show(m){toast.textContent=m;toast.hidden=false;clearTimeout(tt);tt=setTimeout(()=>toast.hidden=true,1400)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

</div></details>`).join('');
document.addEventListener('click',e=>{const b=e.target.closest('.copy');if(!b)return;const el=document.getElementById(b.dataset.copy);
