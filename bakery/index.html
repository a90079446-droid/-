<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>새벽 빵집 · line art</title>
<style>
  html, body { margin: 0; height: 100%; background: #ebe8e2; }
  body { display: grid; place-items: center; }
  .card { width: min(92vw, calc((100vh - 48px) * 16 / 9)); aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; background: #fdfcf8;
          box-shadow: 0 0 0 1px rgba(40, 34, 26, .10), 0 18px 50px -18px rgba(40, 34, 26, .35); }
  #stage, #stage svg { display: block; width: 100%; height: 100%; }
  #stage svg .pp { fill: var(--paper, #fdfdfc); }
</style>
</head>
<body>
  <div class="card"><div id="stage"></div></div>
  <script type="module" src="./bakery.ts"></script>
</body>
</html>
